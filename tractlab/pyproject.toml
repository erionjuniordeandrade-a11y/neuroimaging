[project]
name = "tractlab"
version = "0.1.0"
description = "Tractography workstation: DWI ingest, fiber banks, lesion margins and a browser viewer"
requires-python = ">=3.12"
dependencies = [
    "neuro-core",
    "numpy>=2",
    "scipy>=1.14",
    "nibabel>=5",
    "pydicom>=3",
    "scikit-image>=0.24",
    "defusedxml>=0.7",
    "matplotlib>=3.9",
]

[tool.uv.sources]
neuro-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tractlab"]
