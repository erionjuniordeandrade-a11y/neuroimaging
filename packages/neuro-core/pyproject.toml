[project]
name = "neuro-core"
version = "0.1.0"
description = "Shared geometry, path, hashing and streamline IO for the neuroimaging apps"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "nibabel>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_core"]
