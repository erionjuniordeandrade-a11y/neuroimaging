[project]
name = "case-capsule"
version = "0.1.0"
description = "Offline single-file imaging case capsules (CT + MRI) for surgeon review, patient consultation and teaching"
requires-python = ">=3.11"
dependencies = [
    "neuro-core",
    "pydicom>=2.4",
    "nibabel>=5",
    "numpy>=1.26",
    "SimpleITK>=2.3",
    "highdicom>=0.28.1",
    "rt-utils>=1.2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45", "pillow>=10"]

[tool.uv.sources]
neuro-core = { workspace = true }

[project.scripts]
capsule = "capsule.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capsule"]
