<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro Workbench</title>
<style>
  :root {
    --bg: #07090d; --bg2: #0d1017; --glass: rgba(20,24,33,.72); --hover: rgba(255,255,255,.05);
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
    --text: #ece9e2; --muted: #8f8c85; --faint: #5f5d58; --accent: #C9A84C; --accent-soft: rgba(201,168,76,.13);
    --warn: #e0764f;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --serif: "Playfair Display", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
  button { font: inherit; color: inherit; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .app { display: grid; grid-template-columns: 76px 1fr; grid-template-rows: 52px 1fr; height: 100%; }

  /* Top bar */
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 0;
           border-bottom: 1px solid var(--line); background: var(--bg2); }
  .brand { width: 76px; height: 100%; display: grid; place-items: center; border-right: 1px solid var(--line); }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
                background: linear-gradient(145deg, rgba(201,168,76,.32), rgba(201,168,76,.06));
                border: 1px solid rgba(201,168,76,.45); color: var(--accent); font: 600 15px var(--serif); }
  .app-name { font: 600 17px var(--serif); letter-spacing: .01em; white-space: nowrap; }
  .app-name span { color: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--line); }
  .case-switch { display: flex; align-items: center; gap: 10px; background: none; border: 1px solid var(--line);
                 border-radius: 10px; padding: 5px 10px 5px 12px; cursor: pointer; min-width: 0; max-width: 46vw; }
  .case-switch:hover { border-color: var(--line2); background: var(--hover); }
  .case-switch .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .case-switch .s { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .case-switch svg { width: 14px; height: 14px; color: var(--muted); }
  .tag { display: inline-block; font: 600 9.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--warn);
         border: 1px solid rgba(224,118,79,.45); border-radius: 4px; padding: 0 5px; line-height: 15px; vertical-align: 1px; }
  .spacer { flex: 1; }
  .ruo { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .ruo b { color: var(--warn); font-weight: 600; }

  /* View rail */
  nav { display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; border-right: 1px solid var(--line); background: var(--bg2); }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 2px 8px; border: 1px solid transparent;
               border-radius: 12px; background: none; color: var(--muted); cursor: pointer; font-size: 10.5px; font-weight: 500;
               position: relative; }
  nav button:hover:not(:disabled) { color: var(--text); background: var(--hover); }
  nav button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); border-color: rgba(201,168,76,.35); }
  nav button:disabled { opacity: .3; cursor: not-allowed; }
  nav .kbd { position: absolute; top: 4px; right: 6px; font-size: 9px; color: var(--faint); }

  /* Stage */
  main { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr; }
  .scope { display: flex; align-items: center; gap: 8px; padding: 7px 16px; font-size: 12px; color: var(--muted);
           border-bottom: 1px solid var(--line); background: rgba(255,255,255,.012); }
  .scope .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .stage { position: relative; min-height: 0; background: #000; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .stage iframe[hidden] { display: none; }
  .status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); }
  .status[hidden] { display: none; }
  .card { width: min(420px, 100%); border: 1px solid var(--line); border-radius: 16px; background: var(--glass);
          padding: 22px 22px 20px; text-align: center; }
  .card h3 { margin: 0 0 6px; font: 600 18px var(--serif); }
  .card p { margin: 0; color: var(--muted); }
  .bar { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 18px 0 0; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 3px; animation: slide 1.4s ease-in-out infinite; }
  .status.error .bar { display: none; }
  .status.error h3 { color: var(--warn); }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

  /* Case drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .18s; }
  .drawer { position: fixed; top: 52px; left: 76px; bottom: 0; width: min(360px, calc(100vw - 76px)); z-index: 21;
            background: var(--bg2); border-right: 1px solid var(--line); transform: translateX(-12px); opacity: 0;
            pointer-events: none; transition: transform .18s ease, opacity .18s ease; display: flex; flex-direction: column; }
  body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
  body.drawer-open .drawer { transform: none; opacity: 1; pointer-events: auto; }
  .drawer-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { margin: 0 0 10px; font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .search { width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 9px;
            color: var(--text); padding: 7px 10px; font: inherit; outline: none; }
  .search:focus { border-color: rgba(201,168,76,.55); }
  .case-list { overflow-y: auto; padding: 8px; }
  .case { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left;
          background: none; border: 1px solid transparent; padding: 9px 10px; border-radius: 11px; cursor: pointer; margin-bottom: 3px; }
  .case:hover { background: var(--hover); }
  .case[aria-current="true"] { background: var(--accent-soft); border-color: rgba(201,168,76,.4); }
  .case .av { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.05);
              color: var(--muted); border: 1px solid var(--line); }
  .case[aria-current="true"] .av { color: var(--accent); border-color: rgba(201,168,76,.4); }
  .case b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .case small { display: block; color: var(--muted); }
  .chips { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .chip { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; line-height: 16px; }
  .drawer-foot { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11.5px; }
  .drawer-foot code { color: var(--muted); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 52px 1fr 60px; }
    .brand { width: 52px; } .app-name, .sep, .ruo { display: none; }
    nav { grid-row: 3; flex-direction: row; border-right: 0; border-top: 1px solid var(--line); padding: 6px; }
    nav button { flex: 1; } nav .kbd { display: none; }
    main { grid-row: 2; }
    .drawer { left: 0; width: 100vw; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-case" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><path d="M17 13.5c2 1.2 3 2.6 3 3.5s-1 2.6-3 3.5c-2-.9-3-2.6-3-3.5s1-2.3 3-3.5z"/></symbol>
  <symbol id="i-capsule" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/><path d="M12 8v8"/></symbol>
  <symbol id="i-tracts" viewBox="0 0 24 24"><path d="M4 20c3-5 3-11 8-16"/><path d="M8 20c2-5 4-9 8-13"/><path d="M12 20c2-3 4-6 8-8"/></symbol>
  <symbol id="i-atlas" viewBox="0 0 24 24"><path d="M12 4c-4.4 0-8 3-8 7 0 2.2 1.1 4 2.8 5.2V20h3.6v-2h3.2v2h3.6v-3.8C18.9 15 20 13.2 20 11c0-4-3.6-7-8-7z"/><path d="M12 4v10"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
</svg>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark">N</div></div>
    <div class="app-name">Neuro <span>Workbench</span></div>
    <div class="sep"></div>
    <button class="case-switch" id="case-switch" title="Switch case (K)" aria-haspopup="dialog">
      <span class="t" id="case-title">…</span><span class="s" id="case-sub"></span>
      <svg class="i"><use href="#i-down"/></svg>
    </button>
    <div class="spacer"></div>
    <div class="ruo"><b>Research use only</b> · not for clinical use</div>
  </header>
  <nav role="tablist" aria-label="Views">
    <button role="tab" data-view="case" title="Shared viewer: every image, structure and tract (1)"><span class="kbd">1</span><svg class="i"><use href="#i-case"/></svg>Case</button>
    <button role="tab" data-view="imaging" title="Capsule viewer with tour and QC (2)"><span class="kbd">2</span><svg class="i"><use href="#i-capsule"/></svg>Capsule</button>
    <button role="tab" data-view="tracts" title="TractLab tract evidence (3)"><span class="kbd">3</span><svg class="i"><use href="#i-tracts"/></svg>Tracts</button>
    <button role="tab" data-view="atlas" title="Reference atlas (4)"><span class="kbd">4</span><svg class="i"><use href="#i-atlas"/></svg>Atlas</button>
  </nav>
  <main>
    <div class="scope"><span class="dot"></span><span id="scope"></span></div>
    <div class="stage" id="stage">
      <div class="status" id="status" hidden>
        <div class="card"><h3 id="status-title"></h3><p id="status-text"></p><div class="bar"><i></i></div></div>
      </div>
    </div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Cases">
  <div class="drawer-head">
    <h2>Cases</h2>
    <input class="search" id="search" placeholder="Filter cases" autocomplete="off" spellcheck="false">
  </div>
  <div class="case-list" id="cases"></div>
  <div class="drawer-foot">A case appears only when you name its source: <code>--capsule-dir</code> or <code>--manifest</code>.</div>
</aside>
<script>
const VIEWS = ["case", "imaging", "tracts", "atlas"];
const VIEW_NAME = { case: "Case", imaging: "Capsule viewer", tracts: "Tract evidence", atlas: "Atlas" };
const LOADING = {
  case: "Decoding images, structures and tracts. The first demo build can take up to an hour; later runs reuse it.",
  imaging: "Preparing the capsule. The first demo build can take up to an hour; later runs reuse it.",
  tracts: "Starting TractLab on a loopback port.",
  atlas: "Starting the reference atlas.",
};
const state = { cases: [], caseId: null, view: "case", frames: new Map(), polling: null };
const $ = (id) => document.getElementById(id);

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", "i");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", `#i-${name}`); s.append(u);
  return s;
}

function renderCases() {
  const q = $("search").value.trim().toLowerCase();
  const shown = state.cases.filter((c) => !q || `${c.title} ${c.subtitle}`.toLowerCase().includes(q));
  $("cases").replaceChildren(...shown.map((c) => {
    const b = el("button", "case");
    b.dataset.id = c.id;
    b.setAttribute("aria-current", String(c.id === state.caseId));
    const av = el("span", "av"); av.append(icon(c.synthetic ? "flask" : "folder"));
    const body = el("span");
    const title = el("b", "", c.title);
    if (c.synthetic) title.append(" ", el("span", "tag", "synthetic"));
    const chips = el("span", "chips");
    for (const v of VIEWS) if (c.views[v]) chips.append(el("span", "chip", VIEW_NAME[v]));
    body.append(title, el("small", "", c.subtitle), chips);
    b.append(av, body);
    b.onclick = () => { closeDrawer(); select(c.id, null); };
    return b;
  }));
  if (!shown.length) $("cases").append(el("div", "chip", "No case matches."));
}

function openDrawer() { document.body.classList.add("drawer-open"); renderCases(); setTimeout(() => $("search").focus(), 30); }
function closeDrawer() { document.body.classList.remove("drawer-open"); }

function currentCase() { return state.cases.find((c) => c.id === state.caseId); }

function select(caseId, view) {
  state.caseId = caseId;
  const c = currentCase();
  view = view || state.view;
  if (!c.views[view]) view = VIEWS.find((v) => c.views[v]);
  state.view = view;
  history.replaceState(null, "", `#${encodeURIComponent(caseId)}/${view}`);
  $("case-title").textContent = c.title;
  if (c.synthetic) $("case-title").append(" ", el("span", "tag", "synthetic"));
  $("case-sub").textContent = c.subtitle;
  document.title = `${c.title} · ${VIEW_NAME[view]}`;
  document.querySelectorAll("nav button").forEach((b) => {
    b.disabled = !c.views[b.dataset.view];
    b.setAttribute("aria-selected", String(b.dataset.view === view));
  });
  $("scope").textContent = c.scope;
  renderCases();
  show();
}

function showStatus(title, text, error) {
  $("status").hidden = false;
  $("status").classList.toggle("error", !!error);
  $("status-title").textContent = title;
  $("status-text").textContent = text;
}

async function show() {
  clearTimeout(state.polling);
  const key = `${state.caseId}/${state.view}`;
  for (const [k, f] of state.frames) f.hidden = k !== key;
  if (state.frames.has(key)) { $("status").hidden = true; return; }
  showStatus(`Opening ${VIEW_NAME[state.view]}`, LOADING[state.view]);
  try {
    const s = await getJSON(`/api/case/${encodeURIComponent(state.caseId)}/${state.view}`);
    if (`${state.caseId}/${state.view}` !== key) return;
    if (s.state === "ready") {
      const f = document.createElement("iframe");
      f.src = s.url;
      f.title = `${currentCase().title} · ${VIEW_NAME[state.view]}`;
      f.dataset.key = key;
      f.setAttribute("allow", "fullscreen");
      state.frames.set(key, f);
      $("stage").append(f);
      $("status").hidden = true;
    } else if (s.state === "error") {
      showStatus("This view could not open", s.error, true);
    } else {
      state.polling = setTimeout(show, 800);
    }
  } catch (e) {
    showStatus("The workbench server is not reachable", e.message, true);
  }
}

document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => select(state.caseId, b.dataset.view)));
$("case-switch").onclick = openDrawer;
$("scrim").onclick = closeDrawer;
$("search").oninput = renderCases;
$("search").onkeydown = (e) => { if (e.key === "Enter") $("cases").querySelector(".case")?.click(); };
function handleKey(key) {
  const n = Number(key);
  if (n >= 1 && n <= VIEWS.length && currentCase()?.views[VIEWS[n - 1]]) { select(state.caseId, VIEWS[n - 1]); return true; }
  if (key === "k" || key === "K") { openDrawer(); return true; }
  return false;
}
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") return closeDrawer();
  if (e.target.matches?.("input, select, textarea")) return;
  if (handleKey(e.key)) e.preventDefault();
});
// The Case viewer runs in a same-origin frame and forwards view and case keys here.
window.addEventListener("message", (e) => {
  if (e.origin === location.origin && typeof e.data?.workbenchKey === "string") handleKey(e.data.workbenchKey);
});

(async () => {
  try {
    state.cases = (await getJSON("/api/cases")).cases;
  } catch (e) {
    return showStatus("The workbench server is not reachable", e.message, true);
  }
  const [hashCase, hashView] = decodeURIComponent(location.hash.slice(1)).split("/");
  const first = state.cases.find((c) => c.id === hashCase) || state.cases[0];
  select(first.id, hashView || "case");
})();
</script>
</body>
</html>
