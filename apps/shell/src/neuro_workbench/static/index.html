<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro Workbench</title>
<style>
  :root {
    --bg: #0b0d12; --panel: rgba(255,255,255,.04); --line: rgba(255,255,255,.09);
    --text: #e8e6e1; --muted: #9a978f; --accent: #C9A84C; --warn: #e0764f;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); }
  .app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr; height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 18px;
           border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); }
  header h1 { margin: 0; font: 600 19px var(--serif); letter-spacing: .01em; }
  header h1 span { color: var(--accent); }
  .ruo { margin-left: auto; font-size: 12px; color: var(--muted); border: 1px solid var(--line);
         padding: 4px 10px; border-radius: 999px; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px; }
  aside h2 { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
             margin: 4px 8px 10px; }
  .case { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
          color: inherit; font: inherit; padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }
  .case:hover { background: var(--panel); }
  .case[aria-current="true"] { background: rgba(201,168,76,.10); border-color: rgba(201,168,76,.45); }
  .case b { display: block; font-weight: 600; }
  .case small { color: var(--muted); }
  .tag { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--warn);
         border: 1px solid rgba(224,118,79,.5); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
  main { display: grid; grid-template-rows: auto auto 1fr; min-width: 0; min-height: 0; }
  nav { display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: none; color: var(--muted); font: 500 14px var(--sans); padding: 10px 14px;
               border-bottom: 2px solid transparent; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  nav button:disabled { opacity: .35; cursor: not-allowed; }
  .scope { padding: 8px 18px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .stage { position: relative; min-height: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .stage iframe[hidden] { display: none; }
  .status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; color: var(--muted); text-align: center; padding: 24px; }
  .status[hidden] { display: none; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent);
          animation: spin 1s linear infinite; }
  .status.error .spin { display: none; }
  .status.error { color: var(--warn); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Neuro <span>Workbench</span></h1>
    <div class="ruo">Research and teaching only · not for clinical use</div>
  </header>
  <aside>
    <h2>Cases</h2>
    <div id="cases"></div>
  </aside>
  <main>
    <nav role="tablist">
      <button role="tab" data-view="case">Case · CT / MRI / CTA / tracts</button>
      <button role="tab" data-view="imaging">Capsule viewer</button>
      <button role="tab" data-view="tracts">Tract evidence</button>
      <button role="tab" data-view="atlas">Atlas</button>
    </nav>
    <div class="scope" id="scope"></div>
    <div class="stage" id="stage">
      <div class="status" id="status" hidden><div class="spin"></div><div id="status-text"></div></div>
    </div>
  </main>
</div>
<script>
const LABEL = { case: "Preparing the shared case view. The first demo build takes up to an hour; later runs reuse it", imaging: "Preparing the imaging viewer. The first demo build takes up to an hour; later runs reuse it", tracts: "Starting TractLab", atlas: "Starting the atlas" };
const state = { cases: [], caseId: null, view: "case", frames: new Map(), polling: null };
const $ = (id) => document.getElementById(id);

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

function renderCases() {
  const box = $("cases");
  box.replaceChildren(...state.cases.map((c) => {
    const b = document.createElement("button");
    b.className = "case";
    b.dataset.id = c.id;
    b.setAttribute("aria-current", String(c.id === state.caseId));
    const title = document.createElement("b");
    title.textContent = c.title;
    if (c.synthetic) {
      const t = document.createElement("span"); t.className = "tag"; t.textContent = "synthetic"; title.append(t);
    }
    const sub = document.createElement("small"); sub.textContent = c.subtitle;
    b.append(title, sub);
    b.onclick = () => select(c.id, null);
    return b;
  }));
}

function currentCase() { return state.cases.find((c) => c.id === state.caseId); }

function select(caseId, view) {
  state.caseId = caseId;
  const c = currentCase();
  view = view || state.view;
  if (!c.views[view]) view = ["case", "imaging", "tracts", "atlas"].find((v) => c.views[v]);
  state.view = view;
  history.replaceState(null, "", `#${encodeURIComponent(caseId)}/${view}`);
  renderCases();
  document.querySelectorAll("nav button").forEach((b) => {
    b.disabled = !c.views[b.dataset.view];
    b.setAttribute("aria-selected", String(b.dataset.view === view));
  });
  $("scope").textContent = c.scope;
  show();
}

function showStatus(text, error) {
  $("status").hidden = false;
  $("status").classList.toggle("error", !!error);
  $("status-text").textContent = text;
}

async function show() {
  clearTimeout(state.polling);
  const key = `${state.caseId}/${state.view}`;
  for (const [k, f] of state.frames) f.hidden = k !== key;
  if (state.frames.has(key)) { $("status").hidden = true; return; }
  showStatus(LABEL[state.view] + "…");
  try {
    const s = await getJSON(`/api/case/${encodeURIComponent(state.caseId)}/${state.view}`);
    if (`${state.caseId}/${state.view}` !== key) return;
    if (s.state === "ready") {
      const f = document.createElement("iframe");
      f.src = s.url;
      f.title = `${currentCase().title} · ${state.view}`;
      f.dataset.key = key;
      f.setAttribute("allow", "fullscreen");
      state.frames.set(key, f);
      $("stage").append(f);
      $("status").hidden = true;
    } else if (s.state === "error") {
      showStatus(`Could not open this view: ${s.error}`, true);
    } else {
      state.polling = setTimeout(show, 800);
    }
  } catch (e) {
    showStatus(`Could not reach the workbench server (${e.message}).`, true);
  }
}

document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => select(state.caseId, b.dataset.view)));

(async () => {
  state.cases = (await getJSON("/api/cases")).cases;
  const [hashCase, hashView] = decodeURIComponent(location.hash.slice(1)).split("/");
  const first = state.cases.find((c) => c.id === hashCase) || state.cases[0];
  select(first.id, hashView || "case");
})();
</script>
</body>
</html>
